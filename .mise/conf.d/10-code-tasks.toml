[env]
GOLANGCI_LINT_TIMEOUT = "2m"
# ksm-provider-api is private: fetch it directly instead of through the public proxy and checksum DB.
GOPRIVATE = "github.com/brongineer/*,github.com/BROngineer/*"

[tasks.tidy]
description = "Run go mod tidy"
run = 'go mod tidy'

[tasks.build]
description = "Build convoy"
run = 'go build ./...'

[tasks.fmt]
description = "Run go fmt against code"
run = 'go fmt ./...'

[tasks.vet]
description = "Run go vet against code"
run = 'go vet ./...'

[tasks.fix]
description = "Run go fix against code"
run = 'go fix ./...'

[tasks.format]
description = "Built-in format tools"
depends = ["fmt", "vet", "fix"]

[tasks.lint]
description = "Run linter and quality checks"
depends = ["format"]
run = 'golangci-lint run --timeout={{ env.GOLANGCI_LINT_TIMEOUT }}'

[tasks.test]
description = "Run tests"
run = 'go test -race ./... -cover'
