image:
  repository: ghcr.io/brongineer/ksm-provider-sveltos
  # Defaults to the chart appVersion.
  tag: "v0.1.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Names all objects; defaults to the release name. Set it when installed as a subchart, where the
# release name belongs to the parent chart.
fullnameOverride: ""

replicaCount: 1

# Name kcm matches against ServiceSet.spec.provider.name. The StateManagementProvider of this
# name declares which ServiceAccount may register it with kcm's registry.
providerName: ksm-projectsveltos

# StateManagementProvider declaring this adapter's ServiceAccount to kcm. kcm sets create when it
# installs the adapter: the object needs kcm's CRD with spec.registration.
stateManagementProvider:
  create: false

# kcm system namespace: Region kubeconfig Secrets are read from there.
systemNamespace: kcm-system

# namespace/name of the kcm ServiceAccount allowed to call the adapter.
kcmServiceAccount: kcm-system/kcm-controller-manager

registry:
  # Plain HTTP matches kcm's insecure default; use https:// with caSecret when kcm serves TLS.
  url: http://kcm-ksm-registry.kcm-system.svc:8443
  # Secret holding the CA that verifies the registry. Empty name uses the system roots.
  caSecret:
    name: ""
    key: ca.crt

heartbeatInterval: 10s
# Per-call timeout announced to kcm. Empty leaves the registry default (30s).
providerTimeout: ""

leaderElect: true

# Renews tokens of the management SveltosCluster, as kcm's --enable-sveltos-expire-ctrl did.
enableSveltosExpireCtrl: false

service:
  port: 9443

tls:
  # Serve the provider API over plain HTTP, without any certificate. TESTING AND DEMOS ONLY:
  # bearer tokens travel in clear text and can be replayed by anyone on the pod network.
  # When true, certManager and secretName are ignored. Default for the PoC; set false for TLS.
  insecure: true
  # Issue the serving certificate with cert-manager (self-signed). Disable to bring your own
  # Secret with tls.crt, tls.key and ca.crt.
  certManager: true
  secretName: ""

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
